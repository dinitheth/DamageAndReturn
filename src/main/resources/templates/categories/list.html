<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
  <title>Categories List</title>
  <style>
    .alert-danger {
      background-color: #fff8f6;
      border-left: 4px solid #ff6b6b;
      color: #d63031;
      border-radius: 4px;
    }

    .alert-success {
      background-color: #f0fff4;
      border-left: 4px solid #48bb78;
      color: #2f855a;
      border-radius: 4px;
    }

    .alert-heading {
      color: inherit;
    }
    .card {
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      border: none;
      border-radius: 8px;
      overflow: hidden;
    }

    .table {
      margin-bottom: 0;
    }

    .table th {
      background-color: #f8f9fa;
      font-weight: 500;
    }

    .badge {
      padding: 0.35em 0.65em;
      font-weight: 500;
      border-radius: 4px;
    }

    .bg-success {
      background-color: #48bb78 !important;
    }

    .bg-secondary {
      background-color: #a0aec0 !important;
    }

    /* Action Buttons */
    .btn-sm {
      padding: 0.25rem 0.5rem;
      font-size: 0.875rem;
    }

    .modal-header {
      border-bottom: none;
      padding-bottom: 0;
    }

    .modal-footer {
      border-top: none;
      padding-top: 0;
    }

    .modal-content {
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    #searchInput {
      padding: 12px 20px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: #f8f9fa;
      transition: all 0.3s;
      margin-bottom: 1.5rem;
    }

    #searchInput:focus {
      background-color: white;
      border-color: #86b7fe;
      outline: 0;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }


  </style>
</head>
<body>
<section>
  <!-- Error Message -->
  <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <div class="d-flex align-items-center">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <h5 class="alert-heading mb-0">Cannot Delete Category</h5>
    </div>
    <hr>
    <p th:text="${error}" class="mb-0"></p>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <!-- Success Message -->
  <div th:if="${success != null}" class="alert alert-success alert-dismissible fade show" role="alert">
    <div class="d-flex align-items-center">
      <i class="bi bi-check-circle-fill me-2"></i>
      <span th:text="${success}"></span>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Categories</h2>
    <a th:href="@{/inventory/categories/add}" class="btn btn-success">
      <i class="bi bi-plus-circle"></i> Add Category
    </a>
  </div>

  <div class="card">
    <div class="card-body">
      <table class="table table-hover">
        <thead>
        <tr>
          <th>ID</th>
          <th>Category Name</th>
          <th>Parent Category</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category : ${categories}">
          <td th:text="${category.categoryId}"></td>
          <td th:text="${category.categoryName}"></td>
          <td th:text="${category.parentCategory?.categoryName ?: 'None'}"></td>
          <td>
            <span th:if="${category.active}" class="badge bg-success">Active</span>
            <span th:unless="${category.active}" class="badge bg-secondary">Inactive</span>
          </td>
          <td>
            <div class="btn-group" role="group">
              <a th:href="@{/inventory/categories/edit/{id}(id=${category.categoryId})}" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-pencil"></i>
              </a>
              <button type="button"
                      class="btn btn-sm btn-outline-danger delete-category-btn"
                      th:data-id="${category.categoryId}"
                      th:data-name="${category.categoryName}">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title"><i class="bi bi-exclamation-triangle-fill me-2"></i>Confirm Deletion</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="deleteCategoryMessage" class="mb-3"></p>
          <div id="partsWarning" class="alert alert-warning d-none">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong>Warning:</strong> This category has associated parts!
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <form id="deleteCategoryForm" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-danger">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
      const deleteModal = new bootstrap.Modal(document.getElementById('deleteCategoryModal'));

      document.querySelectorAll('.delete-category-btn').forEach(button => {
        button.addEventListener('click', function() {
          const categoryId = this.getAttribute('data-id');
          const categoryName = this.getAttribute('data-name');

          // Update the form action
          const form = document.getElementById('deleteCategoryForm');
          form.action = `/inventory/categories/delete/${categoryId}`;

          // Set the message
          document.getElementById('deleteCategoryMessage').textContent =
                  `Are you sure you want to permanently delete the "${categoryName}" category?`;

          // Show the modal
          deleteModal.show();
        });
      });

    });
  </script>
</section>
</body>
</html>
