<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | Inventory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-shade: #121212;
            --medium-shade: #2d2d2d;
            --light-shade: #f5f5f5;
            --white: #ffffff;
            --black: #000000;
            --gray-border: #e0e0e0;
        }

        body {
            background-color: var(--light-shade);
            height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background-color: var(--white);
        }

        .card-header {
            background-color: var(--white);
            color: var(--black);
            text-align: center;
            padding: 2rem 1.5rem;
            border-bottom: 1px solid var(--gray-border);
        }

        .card-body {
            padding: 2.5rem;
            background-color: var(--white);
        }

        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--gray-border);
            background-color: var(--white);
            color: var(--medium-shade);
        }

        .form-control:focus {
            border-color: var(--medium-shade);
            box-shadow: 0 0 0 2px rgba(45, 45, 45, 0.1);
        }

        .btn-login {
            background-color: var(--dark-shade);
            color: var(--white);
            border: none;
            padding: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        .btn-login:hover {
            background-color: var(--black);
            transform: translateY(-1px);
        }

        .input-group-text {
            background-color: var(--light-shade);
            border: 1px solid var(--gray-border);
            border-right: none;
            color: var(--medium-shade);
        }

        .input-with-icon {
            border-left: none;
            background-color: var(--white);
        }

        .brand-icon {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: var(--dark-shade);
        }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
            color: var(--medium-shade);
            font-size: 0.85rem;
        }

        .alert {
            border-radius: 6px;
            border-left: 4px solid;
        }

        .alert-danger {
            border-left-color: #dc3545;
        }

        .alert-success {
            border-left-color: #28a745;
        }

        .text-muted {
            color: var(--medium-shade) !important;
        }

        .form-check-input:checked {
            background-color: var(--dark-shade);
            border-color: var(--dark-shade);
        }

        a {
            color: var(--dark-shade);
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: var(--black);
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-5 col-lg-6 col-md-8">
            <div class="card login-card">
                <div class="card-header">
                    <i class="fas fa-boxes brand-icon"></i>
                    <h3 class="mb-0">INVENTORY MANAGEMENT</h3>
                    <p class="text-muted mt-2 mb-0">Secure login to your account</p>
                </div>
                <div class="card-body">
                    <form th:action="@{/login}" method="post">
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${message}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <div class="mb-4">
                            <label for="username" class="form-label text-muted">USERNAME</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control input-with-icon" id="username" name="username"
                                       placeholder="Enter your username" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label text-muted">PASSWORD</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control input-with-icon" id="password" name="password"
                                       placeholder="Enter your password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-login w-100 mb-3 py-2">
                            <i class="fas fa-sign-in-alt me-2"></i>LOGIN
                        </button>


                    </form>
                </div>
            </div>
            <p class="footer-text">&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> Inventory Management System</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
