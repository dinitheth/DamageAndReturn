<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Edit Spare Part</title>
    <style>
        .card-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid rgba(0,0,0,.125);
        }
        .form-label {
            font-weight: 500;
            color: #495057;
        }
        .form-control, .form-select {
            border-radius: 0.375rem;
            border: 1px solid #ced4da;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .form-control:focus, .form-select:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25);
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }
    </style>
</head>
<body>
<section>
    <div class="card shadow-sm">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h3 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Spare Part</h3>
            <div>
                <a th:href="@{/inventory/parts}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-lg me-1"></i> Cancel
                </a>
            </div>
        </div>

        <div class="card-body">
            <form th:action="@{/inventory/parts/update/{id}(id=${part.partId})}" method="post" th:object="${part}">
                <input type="hidden" th:field="*{partId}">

                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="mb-4">
                            <label for="partName" class="form-label">Part Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-box-seam"></i></span>
                                <input type="text" class="form-control" id="partName" th:field="*{partName}" required
                                       placeholder="Enter part name">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="category" class="form-label">Category</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-tags"></i></span>
                                <select class="form-select" id="category" th:field="*{category}" required>
                                    <option value="">-- Select Category --</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.categoryId}"
                                            th:selected="${part.category != null && cat.categoryId == part.category.categoryId}"
                                            th:text="${cat.categoryName}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="brand" class="form-label">Brand</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-building"></i></span>
                                <input type="text" class="form-control" id="brand" th:field="*{brand}"
                                       placeholder="Enter brand name">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="mb-4">
                            <label for="unitPrice" class="form-label">Unit Price</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" class="form-control" id="unitPrice" th:field="*{unitPrice}" required
                                       placeholder="0.00">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="minimumStockLevel" class="form-label">Minimum Stock Level</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-exclamation-triangle"></i></span>
                                <input type="number" class="form-control" id="minimumStockLevel" th:field="*{minimumStockLevel}" required
                                       placeholder="Minimum quantity">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="currentStockLevel" class="form-label">Current Stock Level</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-boxes"></i></span>
                                <input type="number" class="form-control" id="currentStockLevel" th:field="*{currentStockLevel}" required
                                       placeholder="Current quantity">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="storageLocation" class="form-label">Storage Location</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-pin-map"></i></span>
                        <input type="text" class="form-control" id="storageLocation" th:field="*{storageLocation}"
                               placeholder="Enter storage location">
                    </div>
                </div>

                <div class="mb-4 form-check form-switch">
                    <input type="checkbox" class="form-check-input" role="switch" id="isActive" th:field="*{active}">
                    <label class="form-check-label" for="isActive">Active Status</label>
                </div>

                <div class="d-flex justify-content-between border-top pt-4 mt-3">
                    <div>
                        <button type="reset" class="btn btn-outline-secondary me-2">
                            <i class="bi bi-arrow-counterclockwise"></i> Reset
                        </button>
                        <a th:href="@{'/inventory/parts/delete/' + ${part.partId}}" class="btn btn-outline-danger"
                           onclick="return confirm('Are you sure you want to delete this part?')">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </div>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check-circle me-1"></i> Update Part
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
