<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
  <title>Create Return/Damage Record</title>
</head>
<body>
<section>
  <h2>Create Return/Damage Record</h2>
  <form th:action="@{/inventory/returns/add}" method="post" th:object="${returnRecord}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="row g-3">
      <!-- Item Selection -->
      <div class="col-md-6">
        <label class="form-label">Item</label>
        <select class="form-select" th:field="*{itemId}" required>
          <option th:each="i : ${items}" th:value="${i.itemId}" th:text="${i.name}"></option>
        </select>
      </div>

      <!-- Quantity -->
      <div class="col-md-6">
        <label class="form-label">Quantity</label>
        <input type="number" class="form-control" th:field="*{quantity}" min="1" required />
      </div>

      <!-- Return Type -->
      <div class="col-md-6">
        <label class="form-label">Return Type</label>
        <select class="form-select" th:field="*{returnType}" required>
          <option value="DAMAGED">Damaged</option>
          <option value="DEFECTIVE">Defective</option>
          <option value="WRONG_ITEM">Wrong Item</option>
          <option value="EXCESS">Excess Stock</option>
        </select>
      </div>

      <!-- Return Date -->
      <div class="col-md-6">
        <label class="form-label">Return Date</label>
        <input type="date" class="form-control" th:field="*{returnDate}" required />
      </div>

      <!-- Reason -->
      <div class="col-12">
        <label class="form-label">Reason</label>
        <textarea class="form-control" th:field="*{reason}" required></textarea>
      </div>

      <!-- Status -->
      <div class="col-md-6">
        <label class="form-label">Status</label>
        <select class="form-select" th:field="*{status}">
          <option value="PENDING">Pending</option>
          <option value="APPROVED">Approved</option>
          <option value="REJECTED">Rejected</option>
        </select>
      </div>
    </div>

    <!-- Buttons -->
    <div class="mt-3">
      <button class="btn btn-danger" type="submit">Submit Return</button>
      <a th:href="@{/inventory/returns}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</section>
</body>
</html>
