<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
  <title>Return and Damage Orders</title>
</head>
<body>
<section>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Return and Damage Orders</h2>
    <div class="d-flex gap-2 align-items-center">
      <!-- Search Form -->
      <form th:action="@{/inventory/returns}" method="get" class="d-flex" role="search">
        <input class="form-control me-2" type="search" name="q" placeholder="Search by item or reason" th:value="${q}" aria-label="Search">
        <button class="btn btn-outline-primary" type="submit">Search</button>
        <a th:href="@{/inventory/returns}" class="btn btn-link">Clear</a>
      </form>
      <!-- Create Button -->
      <a th:href="@{/inventory/returns/create}" class="btn btn-success">
        <i class="bi bi-plus-circle"></i> Create Return/Damage Record
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <table class="table table-striped table-hover">
        <thead>
        <tr>
          <th>ID</th>
          <th>Item</th>
          <th>Quantity</th>
          <th>Return Type</th>
          <th>Return Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${returns}">
          <td th:text="${r.id}"></td>
          <td th:text="${r.item.name}"></td>
          <td th:text="${r.quantity}"></td>
          <td th:text="${r.returnType}"></td>
          <td th:text="${r.returnDate}"></td>
          <td>
            <span class="badge"
                  th:classappend="${r.status == 'APPROVED'} ? 'bg-success' :
                                   (r.status == 'REJECTED'} ? 'bg-danger' : 'bg-warning text-dark')"
                  th:text="${r.status}">
            </span>
          </td>
          <td>
            <div class="btn-group">
              <a th:href="@{/inventory/returns/{id}(id=${r.id})}" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-eye"></i>
              </a>
              <form th:action="@{/inventory/returns/delete/{id}(id=${r.id})}" method="post" style="display:inline"
                    onsubmit="return confirm('Delete this return record?')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</body>
</html>
