<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
  <title>Purchase Order Details</title>
</head>
<body>
<section>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 th:text="${'PO #' + po.id}"></h2>
    <div></div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <div class="row">
        <div class="col-md-4"><strong>Supplier:</strong> <span th:text="${po.supplier.name}"></span></div>
        <div class="col-md-3"><strong>Status:</strong> <span class="badge bg-info" th:text="${po.status}"></span></div>
        <div class="col-md-3"><strong>Expected:</strong> <span th:text="${po.expectedDate}"></span></div>
        <div class="col-md-2"><strong>Total:</strong> <span th:text="${#numbers.formatDecimal(po.totalAmount, 1, 2)}"></span></div>
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-header">Items</div>
    <div class="card-body">
      <table class="table">
        <thead>
        <tr>
          <th>Part</th>
          <th>Qty</th>
          <th>Unit Price</th>
          <th>Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${po.items}">
          <td th:text="${item.sparePart.partName}"></td>
          <td th:text="${item.quantity}"></td>
          <td th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}"></td>
          <td th:text="${#numbers.formatDecimal(item.lineTotal, 1, 2)}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-header">Add Item</div>
    <div class="card-body">
      <form th:action="@{/inventory/purchase-orders/{id}/items(id=${po.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label">Part</label>
            <select name="sparePartId" class="form-select">
              <option th:each="p : ${parts}" th:value="${p.partId}" th:text="${p.partName}"></option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Qty</label>
            <input name="quantity" type="number" min="1" class="form-control" required />
          </div>
          <div class="col-md-2">
            <label class="form-label">Unit Price</label>
            <input name="unitPrice" type="number" step="0.01" min="0" class="form-control" required />
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-primary" type="submit">Add</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="mt-3">
    <form th:action="@{/inventory/purchase-orders/{id}/status(id=${po.id})}" method="post" class="d-inline">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <select name="status" class="form-select d-inline w-auto">
        <option th:each="s : ${T(com.example.inventory_management.Models.PurchaseOrder.Status).values()}" th:value="${s}" th:text="${s}" th:selected="${s == po.status}"></option>
      </select>
      <button class="btn btn-outline-success" type="submit">Update Status</button>
    </form>
    <a th:href="@{/inventory/purchase-orders}" class="btn btn-secondary">Back</a>
  </div>
</section>
</body>
</html>
